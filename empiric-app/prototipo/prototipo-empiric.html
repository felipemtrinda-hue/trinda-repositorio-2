<title>Protótipo Portal Empiric</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Protótipo do app (tema claro deliberado, igual ao produto). Barra do apresentador em cima; app no palco, em modo computador ou dentro de um celular. */
:root {
  --vinho: #580d26; --bordo: #8c1c3e; --bordo-h: #741634; --rose: #f8eef1; --rose-l: #efd9df;
  --fg: #1d1d1f; --g2: #424245; --muted: #6e6e73; --smoke: #d2d2d7; --mist: #f5f5f7; --line: #ececf0; --paper: #ffffff;
  --ok: #1d7a4a; --ok-bg: #e8f6ee; --warn: #9a5b00; --warn-bg: #fdf3e1; --bad: #c4271b; --bad-bg: #fdeceb; --info: #2a5bd7; --info-bg: #ecf1fd;
  --grad: linear-gradient(145deg, #74163a 0%, #580d26 45%, #2e0616 100%);
  --sh: 0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.06);
  --sh-h: 0 2px 4px rgba(0,0,0,.04), 0 16px 40px rgba(0,0,0,.09);
  --sh-f: 0 12px 40px rgba(0,0,0,.14);
  --sh-b: 0 10px 24px rgba(140,28,62,.32);
  --fd: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fb: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --stage-bg: #ebe8ea;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--stage-bg); color: var(--fg); font-family: var(--fb); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--bordo); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { font-family: var(--fd); margin: 0; letter-spacing: -0.03em; line-height: 1.1; text-wrap: balance; }
p { margin: 0; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Barra do apresentador ---------- */
.presenter { height: 56px; display: flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: #1d1d1f; color: #fff; }
.presenter .tag { font: 600 12px var(--fb); letter-spacing: .04em; background: rgba(255,255,255,.12); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.presenter .sp { flex: 1; }
.seg { display: inline-flex; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; color: rgba(255,255,255,.7); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #fff; color: #1d1d1f; }
.presenter .reset { border: 0; background: none; color: rgba(255,255,255,.7); font-size: 13px; padding: 6px 8px; }
@media (max-width: 1000px) { #modeTag { font-size: 0; padding: 5px; width: 18px; height: 18px; } #modeTag::before { content: '●'; font-size: 12px; } }
@media (max-width: 760px) { .presenter .tag span, .seg.device, .presenter .reset span { display: none; } .seg button { padding: 6px 9px; } }
.presenter .seg, .presenter .tag, .presenter .reset { flex-shrink: 0; }

/* ---------- Palco ---------- */
.stage { height: calc(100% - 56px); display: grid; place-items: stretch; }
.stage.phone { place-items: center; padding: 20px; overflow: auto; }
.frame { width: 100%; height: 100%; background: var(--paper); position: relative; overflow: hidden; }
.stage.phone .frame { width: 390px; height: min(844px, 100%); max-height: 844px; border-radius: 52px; border: 11px solid #1d1d1f; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
.stage.phone .frame::before { content: ""; position: absolute; top: 9px; left: 50%; width: 110px; height: 30px; margin-left: -55px; background: #1d1d1f; border-radius: 20px; z-index: 50; }
.stage.phone .app .hdr { padding-top: 40px; height: 100px; }
.app { container-type: inline-size; height: 100%; }

/* ---------- Layout do app ---------- */
.layout { display: grid; grid-template-columns: 256px minmax(0, 1fr); height: 100%; }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--paper); }
.side .brand { height: 88px; display: flex; align-items: center; padding: 0 22px; }
.side .brand img { height: 60px; width: auto; }
.side .role { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 26px 8px; }
.side nav { flex: 1; overflow: auto; padding: 4px 14px; display: grid; align-content: start; gap: 3px; }
.navi { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 14px; border-radius: 16px; border: 0; background: none; color: var(--g2); font-size: 14.5px; text-align: left; width: 100%; }
.navi:hover { background: var(--mist); color: var(--fg); }
.navi.on { background: var(--grad); color: #fff; font-weight: 600; box-shadow: var(--sh-b); }
.navi .cnt { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--rose); color: var(--bordo); border-radius: 999px; padding: 1px 7px; }
.navi.on .cnt { background: rgba(255,255,255,.2); color: #fff; }
.side .me { margin: 12px 14px 16px; display: flex; gap: 10px; align-items: center; background: var(--mist); border-radius: 18px; padding: 10px; }
.av { width: 38px; height: 38px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font: 700 13px var(--fd); flex: none; overflow: hidden; }
.av.pic { background: var(--line); box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(140,28,62,.18); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.me b { display: block; font-size: 13.5px; } .me span { font-size: 12px; color: var(--muted); }
.col { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.hdr { flex: none; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 28px; background: rgba(255,255,255,.8); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); border-bottom: 1px solid var(--line); z-index: 5; }
.hdr .hello { font-size: 14px; color: var(--muted); } .hdr .hello b { color: var(--fg); }
.hdr .who { display: none; align-items: center; gap: 10px; }
.hdr .who span { font-size: 13px; line-height: 1.2; } .hdr .who span b { display: block; font-size: 14px; }
.bell { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--paper); box-shadow: var(--sh); display: grid; place-items: center; color: var(--g2); }
.bell .dot { position: absolute; top: 9px; right: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--bordo); border: 2px solid #fff; }
.scroll { flex: 1; overflow: auto; padding: 28px 32px 48px; overscroll-behavior: contain; }
.page { max-width: 1120px; margin: 0 auto; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after, *::backdrop { animation: none !important; transition: none !important; } }
.bnav { display: none; position: absolute; left: 14px; right: 14px; bottom: 14px; height: 66px; border-radius: 26px; background: rgba(255,255,255,.82); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); box-shadow: var(--sh-f); align-items: center; justify-content: space-around; z-index: 8; }
.bnav .t { width: 48px; height: 48px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--muted); position: relative; }
.bnav .t svg { width: 22px; height: 22px; }
.bnav .t.on { color: var(--vinho); } .bnav .t.on::after { content: ""; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--vinho); }
.bnav .c { width: 60px; height: 60px; margin-top: -30px; border-radius: 50%; border: 6px solid #fff; background: var(--bordo); color: #fff; display: grid; place-items: center; box-shadow: var(--sh-b); }
.bnav .c svg { width: 24px; height: 24px; stroke-width: 2.3; }
.fab { position: absolute; right: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%; background: #1f8f4e; color: #fff; border: 0; display: grid; place-items: center; box-shadow: var(--sh-f); z-index: 7; }
.fab svg { width: 28px; height: 28px; fill: currentColor; stroke: none; }

  .layout { grid-template-columns: 84px minmax(0, 1fr); }

@container (max-width: 600px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .bnav { display: flex; }
  .hdr { padding: 0 16px; height: 64px; } .hdr .hello { display: none; } .hdr .who { display: flex; }
  .scroll { padding: 20px 16px 120px; }
  .fab { bottom: 96px; right: 16px; }
  .g4, .g3, .g2 { grid-template-columns: minmax(0, 1fr) !important; }
  .g4.keep2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  h1.title { font-size: 32px !important; }
  .kan { grid-auto-flow: column; grid-auto-columns: 82%; overflow-x: auto; grid-template-columns: none !important; scroll-snap-type: x mandatory; }
  .kan > * { scroll-snap-align: start; }
  .hide-m { display: none !important; }
  .btn.sm, .chip { min-height: 44px; }
}
@media (pointer: coarse) { .btn.sm, .chip, .link { min-height: 44px; } }

/* ---------- Componentes ---------- */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1.title { font-size: 44px; font-weight: 700; letter-spacing: -0.045em; margin-top: 10px; }
h1.title em { font-style: normal; background: linear-gradient(120deg, #8c1c3e, #580d26); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.ph .desc { color: var(--muted); margin-top: 8px; max-width: 60ch; }
.card { background: var(--paper); border-radius: 24px; box-shadow: var(--sh); outline: 1px solid rgba(0,0,0,.04); min-width: 0; }
.card.dark { background: var(--grad); color: #fff; outline: 0; box-shadow: var(--sh-b); }
.card.acc { outline: 1.5px solid rgba(140,28,62,.8); }
.card.pad { padding: 24px; }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 20px 24px 10px; }
.ch h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.link { border: 0; background: none; color: var(--bordo); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; padding: 0; }
.g4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.g21 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
.g12 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.stack { display: grid; gap: 14px; }
.stat { padding: 22px; }
.stat .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.stat .lbl { font-size: 14px; font-weight: 500; color: var(--muted); }
.card.dark .lbl, .card.dark .hint { color: rgba(255,255,255,.75); }
.ico { width: 40px; height: 40px; border-radius: 14px; background: var(--rose); color: var(--bordo); display: grid; place-items: center; flex: none; }
.card.dark .ico { background: rgba(255,255,255,.15); color: #fff; }
.stat { container-type: inline-size; }
.stat .val { font: 700 clamp(22px, 13cqi, 30px) var(--fd); letter-spacing: -0.04em; margin-top: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat .hint { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; border: 0; font-weight: 600; font-size: 14.5px; transition: transform .15s, background .15s; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.p { background: var(--bordo); color: #fff; box-shadow: var(--sh-b); } .btn.p:hover { background: var(--bordo-h); }
.btn.s { background: var(--mist); color: var(--fg); } .btn.s:hover { background: #ebebef; }
.btn.w { background: #fff; color: var(--vinho); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn.full { width: 100%; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.b-ok { background: var(--ok-bg); color: var(--ok); } .b-warn { background: var(--warn-bg); color: var(--warn); }
.b-bad { background: var(--bad-bg); color: var(--bad); } .b-info { background: var(--info-bg); color: var(--info); }
.b-brand { background: var(--rose); color: var(--vinho); } .b-n { background: var(--mist); color: var(--g2); }
.rows > * + * { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 24px; min-width: 0; }

.num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }

.field { display: grid; gap: 6px; }

.in { width: 100%; height: 50px; border-radius: 16px; border: 1px solid transparent; background: var(--mist); padding: 0 16px; font-size: 15px; transition: background .15s, box-shadow .15s; }

.in:focus { outline: none; background: #fff; border-color: rgba(140,28,62,.5); box-shadow: 0 0 0 4px var(--rose); }
.form { display: grid; gap: 14px; }
.photo { border-radius: 20px; overflow: hidden; background: var(--mist); aspect-ratio: 4/3; position: relative; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

.glass { background: rgba(255,255,255,.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
.hero { position: relative; overflow: hidden; padding: 28px; }

.hero .big { font: 700 44px var(--fd); letter-spacing: -0.045em; margin-top: 8px; font-variant-numeric: tabular-nums; }
.shortcuts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.sc { display: flex; align-items: center; gap: 12px; border: 0; text-align: left; background: var(--paper); border-radius: 20px; padding: 14px; box-shadow: var(--sh); outline: 1px solid rgba(0,0,0,.04); font-weight: 600; font-size: 14px; transition: transform .15s, box-shadow .15s; }

.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }

.timeline .dt.s { background: var(--bordo); }

.timeline .msg.me { background: var(--rose); }

.kan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.kcol { background: var(--mist); border-radius: 22px; padding: 12px; display: grid; gap: 10px; }

.drop { border: 2px dashed var(--smoke); background: var(--mist); border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; cursor: pointer; }

  else if (a === 'newProp') modal('Novo imóvel', '<form class="form" id="fNewProp"><div class="field"><label for="np1">Título</label><input class="in" id="np1" required placeholder="Apto 101 · Ed. Exemplo"></div><div class="g2"><div class="field"><label for="np2">Endereço</label><input class="in" id="np2" required></div><div class="field"><label for="np3">Bairro</label><input class="in" id="np3" required></div></div><div class="g2"><div class="field"><label for="np4">Aluguel (R$)</label><input class="in" id="np4" inputmode="decimal" required placeholder="1.500,00"></div><div class="field"><label for="np5">Proprietário</label><select class="in" id="np5">' + Object.keys(S.people).filter(function (k) { return S.people[k].role === 'owner'; }).map(function (k) { return '<option value="' + k + '">' + h(name(k)) + '</option>'; }).join('') + '</select></div></div><button class="btn p full" type="submit">Cadastrar imóvel</button></form>');
  else if (a === 'newPerson') modal('Novo cadastro', '<form class="form" id="fNewPerson"><div class="field"><label for="pp1">Nome completo</label><input class="in" id="pp1" required></div><div class="field"><label for="pp2">E-mail</label><input class="in" id="pp2" type="email" required></div><div class="g2"><div class="field"><label for="pp3">Telefone</label><input class="in" id="pp3" inputmode="tel" placeholder="(42) 99999-0000"></div><div class="field"><label for="pp4">Perfil</label><select class="in" id="pp4"><option value="tenant">Inquilino</option><option value="owner">Proprietário</option></select></div></div><p style="font-size:13px;color:var(--muted)">No portal real, a pessoa recebe um convite por e-mail para criar a senha.</p><button class="btn p full" type="submit">Cadastrar e convidar</button></form>');
  else if (a === 'newInv') modal('Lançar boleto', '<form class="form" id="fNewInv"><div class="field"><label for="ni1">Contrato</label><select class="in" id="ni1">' + S.leases.map(function (l) { return '<option value="' + l.id + '">' + h(prop(l.prop).title + ' · ' + name(l.tenant)) + '</option>'; }).join('') + '</select></div><div class="g2"><div class="field"><label for="ni2">Competência</label><input class="in" id="ni2" type="month" required value="' + addMonths(today(), 1).slice(0, 7) + '"></div><div class="field"><label for="ni3">Vencimento</label><input class="in" id="ni3" type="date" required value="' + addMonths(today(), 1).slice(0, 8) + '10"></div></div><p style="font-size:13px;color:var(--muted)">Itens: aluguel do contrato, condomínio de R$ 360,00 e IPTU de R$ 60,00. O inquilino recebe o aviso na hora.</p><button class="btn p full" type="submit">Lançar e publicar</button></form>');
  else if (a === 'newEvent') modal('Novo evento', '<form class="form" id="fNewEv"><div class="field"><label for="ne1">Título</label><input class="in" id="ne1" required placeholder="Vistoria de saída"></div><div class="g2"><div class="field"><label for="ne2">Data</label><input class="in" id="ne2" type="date" required value="' + addDays(today(), 3) + '"></div><div class="field"><label for="ne3">Tipo</label><select class="in" id="ne3"><option value="insp">Vistoria</option><option value="mnt">Manutenção</option><option value="pay">Repasse</option><option value="rem">Lembrete</option></select></div></div><button class="btn p full" type="submit">Adicionar à agenda</button></form>');

  else if (a === 'saved') toast('Alterações salvas.');
  else if (a === 'pf') { UI.pf = id; render(); }
  else if (a === 'if') { UI.invFilter = id; render(); }
  else if (a === 'more') { var role = route().slice(0, 3); modal(ROLE_LABEL[role], '<div class="g3 keep2" style="grid-template-columns:repeat(3,minmax(0,1fr))">' + NAV[role].map(function (n) { return '<button class="sc" style="flex-direction:column;text-align:center;font-size:12.5px" data-go="' + role + '-' + n[0] + '"><span class="ico">' + ic(n[2]) + '</span>' + n[1] + '</button>'; }).join('') + '</div><button class="btn s full" style="margin-top:14px" data-go="">' + ic('out') + ' Sair</button>', 'sheet'); }
  else if (a === 'readall') { var u = USER[route().slice(0, 3)]; (S.notes[u] || []).forEach(function (n) { n.read = true; }); save(); render(); }
  else if (a === 'note') { var u2 = USER[route().slice(0, 3)], n = S.notes[u2][+id]; n.read = true; save(); go(n.go); }
  else if (a === 'tstatus') {
    var t = ticket(id), s = el.dataset.s; if (t.status === s) return;
    t.status = s; t.ev.push({ who: 'A1', at: nowStr(), status: s }); notify(t.by, 'Chamado #' + t.id + ' atualizado', 'Nova etapa: ' + STATUS_T[s][0], 'inq-chamado-' + t.id);
    log('Equipe Empiric', 'moveu o chamado #' + t.id + ' para ' + STATUS_T[s][0].toLowerCase()); save(); render(); toast('Etapa atualizada. ' + first(name(t.by)) + ' foi avisado(a).');
  }
  else if (a === 'rstatus') {
    var r = S.refs.filter(function (x) { return x.id === +id; })[0]; r.status = el.dataset.s;
    notify(r.by, 'Sua indicação foi atualizada', r.name + ': ' + STATUS_R[r.status][0].toLowerCase(), 'inq-indique'); save(); render(); toast('Indicação atualizada e inquilino avisado.');
  }
});
function bindForms() {
  var f;
  if ((f = document.getElementById('fTicket'))) {
    var files = [];
    document.getElementById('tf').addEventListener('change', function (e) {
      Array.prototype.slice.call(e.target.files, 0, 3).forEach(function (file) {
        if (!file.type.startsWith('image/')) { files.push(null); return; }
        shrink(file, 360, function (src) { files.push(src); document.getElementById('thumbs').innerHTML = files.filter(Boolean).map(function (s) { return '<img src="' + s + '" alt="Anexo">'; }).join(''); });
      });
    });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var id = nextNum(S.tickets.map(function (x) { return x.id; })), ti = document.getElementById('tt').value.trim(), de = document.getElementById('td').value.trim();
      S.tickets.unshift({ id: id, ord: Date.now(), prop: leaseOfTenant(USER.inq).prop, by: USER.inq, cat: document.getElementById('tc').value, title: ti, prio: document.getElementById('tp').value, status: 'new', at: today(), ev: [{ who: USER.inq, at: nowStr(), status: 'new', msg: de }], photos: files.length, files: files.filter(Boolean).slice(0, 2) });
      notify('A1', 'Novo chamado #' + id, 'Apto 302 · ' + ti, 'adm-chamado-' + id); log(name(USER.inq), 'abriu o chamado #' + id);
      save(); go('inq-chamado-' + id); toast('Chamado #' + id + ' enviado. A equipe foi avisada.');
    });
  }
  if ((f = document.getElementById('fMsg'))) f.addEventListener('submit', function (e) {
    e.preventDefault(); var t = ticket(e.currentTarget.dataset.id), adm = route().slice(0, 3) === 'adm', msg = document.getElementById('mm').value.trim(); if (!msg) return;
    t.ev.push({ who: adm ? 'A1' : t.by, at: nowStr(), msg: msg });
    if (adm) notify(t.by, 'A Empiric respondeu o chamado #' + t.id, msg.slice(0, 80), 'inq-chamado-' + t.id); else notify('A1', 'Nova mensagem no chamado #' + t.id, msg.slice(0, 80), 'adm-chamado-' + t.id);
    save(); render(); toast('Mensagem enviada.');
  });
  if ((f = document.getElementById('fRef'))) f.addEventListener('submit', function (e) {
    e.preventDefault(); var n = document.getElementById('rn').value.trim();
    S.refs.unshift({ id: nextNum(S.refs.map(function (x) { return x.id; })), ord: Date.now(), by: USER.inq, name: n, contact: document.getElementById('rc').value.trim(), notes: document.getElementById('ro').value.trim(), status: 'received', at: br(today()) });
    notify('A1', 'Nova indicação recebida', n + ' · por ' + name(USER.inq), 'adm-indicacoes'); save(); render(); toast('Indicação enviada. Obrigado!');
  });
  if ((f = document.getElementById('fPay'))) f.addEventListener('submit', function (e) {
    e.preventDefault(); var i = invoice(e.currentTarget.dataset.id), l = lease(i.lease);
    i.status = 'paid'; i.paidAt = document.getElementById('pd').value || today(); i.method = document.getElementById('pm').value;
    notify(l.tenant, 'Pagamento confirmado', 'Recebemos o pagamento de ' + comp(i.comp) + '. Obrigado!', 'inq-faturas');
    log('Equipe Empiric', 'registrou o pagamento de ' + comp(i.comp) + ' · ' + prop(l.prop).title.split(' · ')[0]); save(); render(); toast('Boleto baixado. ' + first(name(l.tenant)) + ' recebeu a confirmação.');
  });
  if ((f = document.getElementById('fAnn'))) f.addEventListener('submit', function (e) {
    e.preventDefault(); var ti = document.getElementById('at').value.trim(), aud = document.getElementById('aa').value;
    S.anns.unshift({ id: nextNum(S.anns.map(function (x) { return x.id; })), ord: Date.now(), title: ti, body: document.getElementById('ab').value.trim(), aud: aud, at: br(today()), news: document.getElementById('an').checked });
    var to = Object.keys(S.people).filter(function (k) { var p = S.people[k]; return p.role !== 'admin' && (aud === 'all' || p.role === aud || (aud === 'P1' && (k === 'T1' || k === 'O1'))); });
    to.forEach(function (k) { notify(k, 'Novo comunicado', ti, (S.people[k].role === 'tenant' ? 'inq' : 'pro') + '-avisos'); });
    log('Equipe Empiric', 'publicou o comunicado "' + ti + '"'); save(); render(); toast('Publicado para ' + to.length + ' pessoa' + (to.length === 1 ? '' : 's') + '.');
  });
}

dlg.addEventListener('submit', function (e) {
  e.preventDefault(); var f = e.target, v = function (id) { return document.getElementById(id).value.trim(); };
  if (!f.reportValidity()) return;
  if (f.id === 'fNewProp') {
    var rent = parseFloat(v('np4').replace(/\./g, '').replace(',', '.')); if (!(rent > 0)) { toast('Informe um aluguel válido.'); return; }
    var n = S.props.length + 1, id = 'P' + nextNum(S.props.map(function (x) { return +String(x.id).slice(1) || 0; }).concat([10]));
    S.props.push({ id: id, ord: Date.now(), title: v('np1'), addr: v('np2'), district: v('np3'), status: 'available', rent: rent, beds: 2, area: 60, photo: (n % 2) * 2, owner: v('np5'), code: 'EMP-' + String(100 + n) });
    log('Equipe Empiric', 'cadastrou o imóvel ' + v('np1')); save(); closeDlg(); go('adm-imovel-' + id); toast('Imóvel cadastrado.');
  } else if (f.id === 'fNewPerson') {
    var key = 'N' + Date.now().toString(36); S.people[key] = { name: v('pp1'), role: v('pp4'), email: v('pp2'), phone: v('pp3') || '—' };
    UI.pf = v('pp4'); log('Equipe Empiric', 'convidou ' + v('pp1')); save(); closeDlg(); render(); toast('Cadastro criado. Convite enviado para ' + v('pp2') + '.');
  } else if (f.id === 'fNewInv') {
    var l = lease(v('ni1')), c = v('ni2') + '-01';
    if (S.inv.some(function (i) { return i.lease === l.id && i.comp === c; })) { toast('Já existe boleto deste contrato nessa competência.'); return; }
    var bid = 'B' + nextNum(S.inv.map(function (x) { return +String(x.id).slice(1) || 0; })); S.inv.push({ id: bid, ord: Date.now(), lease: l.id, comp: c, due: v('ni3'), amount: l.rent + 420, status: 'pending', items: [['Aluguel', l.rent], ['Condomínio', 360], ['IPTU (parcela)', 60]] });
    notify(l.tenant, 'Novo boleto disponível', comp(c) + ' · ' + money(l.rent + 420) + ' · vence ' + br(v('ni3')), 'inq-faturas');
    log('Equipe Empiric', 'lançou o boleto de ' + comp(c) + ' · ' + prop(l.prop).title.split(' · ')[0]); save(); closeDlg(); go('adm-boleto-' + bid); toast('Boleto lançado. ' + first(name(l.tenant)) + ' foi avisado(a).');
  } else if (f.id === 'fNewEv') {
    S.events.push({ id: uid4(), ord: Date.now(), d: v('ne2'), t: v('ne1'), k: v('ne3') }); save(); closeDlg(); render(); toast('Evento adicionado à agenda.');
  }
});
document.addEventListener('change', function (e) {
  var inp = e.target; if (!inp.dataset || !inp.dataset.photo) return;
  var p = prop(inp.dataset.photo); p.extra = p.extra || [];
  Array.prototype.slice.call(inp.files, 0, 4).forEach(function (file) {
    if (!/^image\//.test(file.type) || file.size > 10 * 1024 * 1024) { toast('Use imagens JPG, PNG ou WebP de até 10 MB.'); return; }
    if (p.extra.length >= 6) { toast('Limite de 6 fotos extras neste protótipo.'); return; }
    shrink(file, 560, function (src) { p.extra.push(src); save(); render(); toast('Foto adicionada. O proprietário já vê na ficha do imóvel.'); });
  });
});

/* ---------- Dispositivo e reinício ---------- */
var stage = document.getElementById('stage');
function setDev(d) {
  UI.dev = d; try { localStorage.setItem(KEY + ':dev', d); } catch (e) {}
  stage.classList.toggle('phone', d === 'phone');
  document.querySelectorAll('#devSeg button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.dev === d ? 'true' : 'false'); });
}
document.getElementById('resetBtn').addEventListener('click', function () {
  if (MODE === 'shared') { toast('Os dados são compartilhados entre todos que usam este link.'); return; }
  S = seed(); save(); UI.open = {}; go(''); toast('Demonstração reiniciada.');
});
setDev(window.matchMedia('(max-width: 760px)').matches ? 'desk' : UI.dev);
render();
})();
</script>
