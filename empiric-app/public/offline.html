<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sem conexão · Empiric</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fff; color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { height: 64px; margin-bottom: 32px; }
  .badge { width: 64px; height: 64px; border-radius: 22px; background: #f8eef1; color: #8c1c3e; display: grid; place-items: center; margin: 0 auto 20px; }
  h1 { font-size: 30px; letter-spacing: -0.04em; line-height: 1.1; margin: 0 0 10px; }
  h1 span { color: #8c1c3e; }
  p { color: #6e6e73; line-height: 1.55; margin: 0 0 28px; }
  button { height: 52px; padding: 0 28px; border: 0; border-radius: 999px; background: #8c1c3e; color: #fff;
    font-size: 16px; font-weight: 600; box-shadow: 0 10px 24px rgba(140, 28, 62, .32); cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/brand/empiric-horizontal.png" alt="Empiric Negócios Imobiliários">
  <div class="badge" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76M2 2l20 20"/></svg>
  </div>
  <h1>Você está <span>sem conexão</span></h1>
  <p>Seus boletos e documentos ficam protegidos e só aparecem com internet. Assim que a conexão voltar, é só tentar de novo.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
